[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.dev]
debug = "full"

[profile.dev.package."*"]
debug = "line-tables-only"

[workspace.dependencies]
gpui-kit = "0.9.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bitflags = "2"
toml = "1"
dirs = "7"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1", features = [
    "process",
    "rt-multi-thread",
    "macros",
    "time",
] }
serde_json = "1"
serde_yaml_ng = "0.10"
futures = "0.3"
open = "5"
nucleo-matcher = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
minijinja = "2"
getrandom = "0.4"
sha2 = "0.10"
semver = "1"
agent-client-protocol = { version = "5", features = ["process"] }
which = "8"
dunce = "1"
tauri-winrt-notification = "0.8"
windows-sys = "0.61"
