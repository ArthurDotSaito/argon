query PrDetail($id: ID!) {
  node(id: $id) {
    ... on PullRequest {
      ...PullRequestFields
      headRefOid
      body
      labels(first: 50) {
        nodes {
          name
          color
        }
      }
      allCommits: commits(first: 250) {
        nodes {
          commit {
            oid
            messageHeadline
            messageBody
            committedDate
            additions
            deletions
            author {
              name
              user {
                login
              }
            }
            statusCheckRollup {
              state
            }
          }
        }
      }
      reviewThreads(first: 100) {
        pageInfo {
          hasNextPage
        }
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          startLine
          originalLine
          originalStartLine
          diffSide
          startDiffSide
          comments(first: 50) {
            pageInfo {
              hasNextPage
            }
            nodes {
              id
              author {
                login
              }
              body
              createdAt
            }
          }
        }
      }
      timelineItems(
        last: 100
        itemTypes: [
          ISSUE_COMMENT
          PULL_REQUEST_REVIEW
          PULL_REQUEST_COMMIT
          REVIEW_REQUESTED_EVENT
          LABELED_EVENT
          HEAD_REF_FORCE_PUSHED_EVENT
          MERGED_EVENT
          CLOSED_EVENT
          READY_FOR_REVIEW_EVENT
        ]
      ) {
        pageInfo {
          hasPreviousPage
        }
        nodes {
          __typename
          ... on IssueComment {
            id
            author {
              login
            }
            body
            createdAt
          }
          ... on PullRequestReview {
            id
            author {
              login
            }
            state
            body
            submittedAt
            createdAt
            comments(first: 50) {
              nodes {
                path
                line
                body
                diffHunk
              }
            }
          }
          ... on PullRequestCommit {
            commit {
              oid
              messageHeadline
              committedDate
              author {
                name
                user {
                  login
                }
              }
            }
          }
          ... on ReviewRequestedEvent {
            actor {
              login
            }
            requestedReviewer {
              ... on User {
                login
              }
              ... on Mannequin {
                login
              }
              ... on Team {
                slug
                organization {
                  login
                }
              }
            }
            createdAt
          }
          ... on LabeledEvent {
            actor {
              login
            }
            label {
              name
            }
            createdAt
          }
          ... on HeadRefForcePushedEvent {
            actor {
              login
            }
            createdAt
          }
          ... on MergedEvent {
            actor {
              login
            }
            createdAt
          }
          ... on ClosedEvent {
            actor {
              login
            }
            createdAt
          }
          ... on ReadyForReviewEvent {
            actor {
              login
            }
            createdAt
          }
        }
      }
    }
  }
}
