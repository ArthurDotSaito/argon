query IssueDetail($id: ID!) {
  node(id: $id) {
    __typename
    ... on Issue {
      ...IssueFields
      body
      timelineItems(
        last: 100
        itemTypes: [
          ISSUE_COMMENT
          ASSIGNED_EVENT
          UNASSIGNED_EVENT
          LABELED_EVENT
          UNLABELED_EVENT
          CLOSED_EVENT
          REOPENED_EVENT
          CROSS_REFERENCED_EVENT
          CONNECTED_EVENT
          MILESTONED_EVENT
        ]
      ) {
        pageInfo {
          hasPreviousPage
        }
        nodes {
          __typename
          ... on IssueComment {
            id
            author {
              login
            }
            body
            createdAt
            url
          }
          ... on AssignedEvent {
            actor {
              login
            }
            assignee {
              ... on User {
                login
              }
              ... on Bot {
                login
              }
              ... on Mannequin {
                login
              }
              ... on Organization {
                login
              }
            }
            createdAt
          }
          ... on UnassignedEvent {
            actor {
              login
            }
            assignee {
              ... on User {
                login
              }
              ... on Bot {
                login
              }
              ... on Mannequin {
                login
              }
              ... on Organization {
                login
              }
            }
            createdAt
          }
          ... on LabeledEvent {
            actor {
              login
            }
            label {
              name
            }
            createdAt
          }
          ... on UnlabeledEvent {
            actor {
              login
            }
            label {
              name
            }
            createdAt
          }
          ... on ClosedEvent {
            actor {
              login
            }
            createdAt
          }
          ... on ReopenedEvent {
            actor {
              login
            }
            createdAt
          }
          ... on CrossReferencedEvent {
            actor {
              login
            }
            source {
              __typename
              ... on Issue {
                number
                repository {
                  nameWithOwner
                }
              }
              ... on PullRequest {
                number
                repository {
                  nameWithOwner
                }
              }
            }
            createdAt
          }
          ... on ConnectedEvent {
            actor {
              login
            }
            subject {
              __typename
              ... on Issue {
                number
                repository {
                  nameWithOwner
                }
              }
              ... on PullRequest {
                number
                repository {
                  nameWithOwner
                }
              }
            }
            createdAt
          }
          ... on MilestonedEvent {
            actor {
              login
            }
            milestoneTitle
            createdAt
          }
        }
      }
      linkedPullRequests: closedByPullRequestsReferences(first: 10) {
        nodes {
          ...PullRequestFields
        }
      }
      subIssues(first: 50) {
        nodes {
          number
          title
          state
          repository {
            nameWithOwner
          }
        }
      }
    }
  }
}
