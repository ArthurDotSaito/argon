fragment PullRequestFields on PullRequest {
  id
  number
  title
  url
  isDraft
  state
  createdAt
  updatedAt
  closedAt
  author {
    login
  }
  repository {
    nameWithOwner
  }
  baseRefName
  headRefName
  additions
  deletions
  changedFiles
  reviewDecision
  mergeable
  comments {
    totalCount
  }
  reviewRequests(first: 20) {
    nodes {
      requestedReviewer {
        ... on User {
          login
        }
        ... on Team {
          slug
          organization {
            login
          }
        }
      }
    }
  }
  assignees(first: 10) {
    nodes {
      login
    }
  }
  latestReviews(first: 20) {
    nodes {
      author {
        login
      }
      state
      submittedAt
    }
  }
  commits(last: 1) {
    nodes {
      commit {
        committedDate
        statusCheckRollup {
          state
        }
      }
    }
  }
}
