[package]
name = "argon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "argon"
path = "src/main.rs"

[dependencies]
argon-agents = { path = "../argon-agents" }
argon-core = { path = "../argon-core" }
argon-github = { path = "../argon-github" }
argon-store = { path = "../argon-store" }
gpui-kit = { workspace = true, features = [
    "tree-sitter-csharp",
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
chrono.workspace = true
futures.workspace = true
open.workspace = true
nucleo-matcher.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
argon-core = { path = "../argon-core", features = ["test-fixtures"] }

[package.metadata.packager]
productName = "Argon"
identifier = "br.com.nuria.argon"
publisher = "Nuria"
copyright = "Copyright (c) Nuria"
description = "Aplicativo desktop de review de Pull Requests do GitHub"
formats = ["nsis"]
icons = ["../../assets/icon.ico"]

[package.metadata.packager.nsis]
installMode = "currentUser"
languages = ["PortugueseBR"]
installerIcon = "../../assets/icon.ico"
template = "../../packaging/nsis/installer.nsi"
